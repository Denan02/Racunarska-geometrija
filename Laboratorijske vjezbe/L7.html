<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presjek Duži - Canvas</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        h2 {
            color: #333;
        }
        .controls {
            margin-bottom: 20px;
        }
        button {
            padding: 12px 20px;
            font-size: 15px;
            font-weight: bold;
            margin: 0 10px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        canvas {
            border: 2px solid #333;
            background-color: #ffffff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <h2>Vizualizacija Presjeka Duži</h2>
    
    <div class="controls">
        <button onclick="pokreniMetodu1()">1. Horizontalne i Vertikalne duži</button>
        <button onclick="pokreniMetodu2()">2. Proizvoljne duži</button>
    </div>

    <canvas id="platno" width="800" height="600"></canvas>

    <script>
        const canvas = document.getElementById('platno');
        const ctx = canvas.getContext('2d');

        // Globalni nizovi za čuvanje podataka
        let globalneDuzi = [];
        let globalniPresjeci = [];

        // Funkcija za generisanje nasumičnog broja u opsegu
        function rand(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        // Klasa za definisanje duži
        class Duz {
            constructor(x1, y1, x2, y2) {
                this.p1 = { x: x1, y: y1 };
                this.p2 = { x: x2, y: y2 };
                this.imaPresjek = false; // Služi za bojenje u zeleno
            }
        }

        // --- METODA 1: Horizontalne i Vertikalne duži ---
        function pokreniMetodu1() {
            let n = 15; // Broj horizontalnih duži
            let m = 15; // Broj vertikalnih duži
            
            // Resetuj globalne nizove i konzolu
            globalneDuzi = [];
            globalniPresjeci = [];
            console.clear();
            console.log("%c--- METODA 1: Horizontalne i Vertikalne ---", "color: blue; font-weight: bold;");

            // a) Generiši n horizontalnih duži
            for (let i = 0; i < n; i++) {
                let y = rand(50, canvas.height - 50);
                let x1 = rand(50, canvas.width - 200);
                let x2 = x1 + rand(50, 200); // Dužina između 50 i 250px
                globalneDuzi.push(new Duz(x1, y, x2, y));
            }

            // b) Generiši m vertikalnih duži
            for (let i = 0; i < m; i++) {
                let x = rand(50, canvas.width - 50);
                let y1 = rand(50, canvas.height - 200);
                let y2 = y1 + rand(50, 200);
                globalneDuzi.push(new Duz(x, y1, x, y2));
            }

            // c) Brute-force traženje presjeka (svaka sa svakom)
            for (let i = 0; i < globalneDuzi.length; i++) {
                for (let j = i + 1; j < globalneDuzi.length; j++) {
                    let d1 = globalneDuzi[i];
                    let d2 = globalneDuzi[j];

                    let tacka = nadjiPresjekHV(d1, d2);
                    if (tacka) {
                        d1.imaPresjek = true;
                        d2.imaPresjek = true;
                        globalniPresjeci.push(tacka);
                        console.log(`Presjek pronađen na: X=${tacka.x.toFixed(1)}, Y=${tacka.y.toFixed(1)}`);
                    }
                }
            }

            iscrtajSve();
        }

        // Pomoćna funkcija za presjek isključivo H i V duži
        function nadjiPresjekHV(d1, d2) {
            // Identifikujemo koja je horizontalna, a koja vertikalna
            let h = null, v = null;

            if (d1.p1.y === d1.p2.y && d2.p1.x === d2.p2.x) { h = d1; v = d2; }
            else if (d2.p1.y === d2.p2.y && d1.p1.x === d1.p2.x) { h = d2; v = d1; }
            
            if (!h || !v) return null; // Ako su obje H ili obje V, preskačemo (uzimamo u obzir samo krstaste presjeke)

            // Provjera opsega preklapanja
            let minX = Math.min(h.p1.x, h.p2.x);
            let maxX = Math.max(h.p1.x, h.p2.x);
            let minY = Math.min(v.p1.y, v.p2.y);
            let maxY = Math.max(v.p1.y, v.p2.y);

            if (v.p1.x >= minX && v.p1.x <= maxX && h.p1.y >= minY && h.p1.y <= maxY) {
                return { x: v.p1.x, y: h.p1.y };
            }
            return null;
        }


        // --- METODA 2: Proizvoljne duži ---
        function pokreniMetodu2() {
            let n = 20; // Ukupan broj proizvoljnih duži
            
            globalneDuzi = [];
            globalniPresjeci = [];
            console.clear();
            console.log("%c--- METODA 2: Proizvoljne duži ---", "color: darkgreen; font-weight: bold;");

            // a) Generiši n duži u proizvoljnom položaju
            for (let i = 0; i < n; i++) {
                let x1 = rand(50, canvas.width - 50);
                let y1 = rand(50, canvas.height - 50);
                let x2 = x1 + rand(-150, 150);
                let y2 = y1 + rand(-150, 150);
                globalneDuzi.push(new Duz(x1, y1, x2, y2));
            }

            // b) Brute-force algoritam za proizvoljne duži
            for (let i = 0; i < globalneDuzi.length; i++) {
                for (let j = i + 1; j < globalneDuzi.length; j++) {
                    let tacka = nadjiPresjekProizvoljnih(globalneDuzi[i], globalneDuzi[j]);
                    if (tacka) {
                        globalneDuzi[i].imaPresjek = true;
                        globalneDuzi[j].imaPresjek = true;
                        globalniPresjeci.push(tacka);
                        console.log(`Presjek pronađen na: X=${tacka.x.toFixed(1)}, Y=${tacka.y.toFixed(1)}`);
                    }
                }
            }

            iscrtajSve();
        }

        // Matematički algoritam za presjek dvije proizvoljne duži (pomoću determinanti/vektora)
        function nadjiPresjekProizvoljnih(d1, d2) {
            let x1 = d1.p1.x, y1 = d1.p1.y;
            let x2 = d1.p2.x, y2 = d1.p2.y;
            let x3 = d2.p1.x, y3 = d2.p1.y;
            let x4 = d2.p2.x, y4 = d2.p2.y;

            // Nazivnik (determinanta)
            let den = (x1 - x2) * (y3 - y4) - (y1 - y2) * (x3 - x4);
            if (den === 0) return null; // Duži su paralelne

            // Parametri t i u na pravcima
            let t = ((x1 - x3) * (y3 - y4) - (y1 - y3) * (x3 - x4)) / den;
            let u = -((x1 - x2) * (y1 - y3) - (y1 - y2) * (x1 - x3)) / den;

            // Ako su t i u između 0 i 1, presjek je unutar oba segmenta duži
            if (t >= 0 && t <= 1 && u >= 0 && u <= 1) {
                return {
                    x: x1 + t * (x2 - x1),
                    y: y1 + t * (y2 - y1)
                };
            }
            return null;
        }


        // --- VIZUALIZACIJA (Crtanje na Canvasu) ---
        function iscrtajSve() {
            // Očisti prethodni sadržaj platna
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Nacrtaj duži
            globalneDuzi.forEach(duz => {
                ctx.beginPath();
                ctx.moveTo(duz.p1.x, duz.p1.y);
                ctx.lineTo(duz.p2.x, duz.p2.y);
                
                if (duz.imaPresjek) {
                    ctx.strokeStyle = '#28a745'; // Zelena boja za presječene duži
                    ctx.lineWidth = 3;
                } else {
                    ctx.strokeStyle = '#6c757d'; // Siva boja za obične duži
                    ctx.lineWidth = 1.5;
                }
                ctx.stroke();
            });

            // 2. Nacrtaj tačke presjeka crvenom bojom
            globalniPresjeci.forEach(tacka => {
                ctx.beginPath();
                ctx.arc(tacka.x, tacka.y, 5, 0, 2 * Math.PI);
                ctx.fillStyle = '#dc3545'; // Crvena boja
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1;
                ctx.stroke();
            });
        }
    </script>
</body>
</html>
